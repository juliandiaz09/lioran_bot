      - no tiene caso vivir
      - no vale la pena vivir
      - no vale la pena seguir viviendo

  desesperanza_moderada:
    nivel: MEDIUM
    patrones:
      - no puedo mas
      - ya no puedo mas
      - no aguanto mas
      - ya no aguanto
