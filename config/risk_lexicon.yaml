      - no tengo esperanza
      - ya nada tiene sentido
      - nada tiene sentido
      - la vida no tiene sentido
      - mi vida no tiene sentido
      - ya no tiene sentido vivir
      - regex: '\bno\s+le\s+(?:veo|encuentro|hallo|busco)\s+(?:ningun\s+)?sentido\s+a\s+(?:la\s+vida|vivir|seguir\s+viviendo)'
